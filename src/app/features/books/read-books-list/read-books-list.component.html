<div class="app-page">
  <h1>Read Books</h1>
  <app-generic-list
    [items]="books"
    listType="books"
    [config]="{
      page: currentPage,
      pageSize: pageSize,
      totalPages: totalPages,
      sortOptions: sortOptions,
    }"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (sortChange)="onSortChange($event)"
  ></app-generic-list>
</div>
