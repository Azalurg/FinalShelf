<div class="app-page">
  <h1>Books</h1>
  <div class="book-toolbar">
    <div class="app-pagination">
      <button (click)="prevPage()" style="margin-right: 1rem">
        <img src="assets/icons/chevron-left-duo-svgrepo-com.svg" alt="left" />
      </button>
      <select id="limit" (change)="changePageSize($event)">
        <option [value]="9">9</option>
        <option [value]="21" selected>21</option>
        <option [value]="40">40</option>
        <option [value]="66">66</option>
        <option [value]="99">99</option>
      </select>
      <button (click)="nextPage()" style="margin-left: 1rem">
        <img src="assets/icons/chevron-right-duo-svgrepo-com.svg" alt="right" />
      </button>
    </div>
    <div class="app-sort">
      <label for="sort">Sort:</label>
      <select id="sort" (change)="changeSortOrder($event)">
        <option [value]="0">---</option>
        <option [value]="1">Title ^</option>
        <option [value]="2">Title v</option>
        <option [value]="3" selected>Author ^</option>
        <option [value]="4">Author v</option>
      </select>
    </div>
  </div>

  <app-book-list-component [books]="books"></app-book-list-component>
</div>
