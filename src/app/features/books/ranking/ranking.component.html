<div class="app-page">
  <h1>Ranking</h1>
  <app-generic-list
    [items]="books"
    listType="books"
    [config]="{
      page: currentPage,
      pageSize: pageSize,
      totalPages: totalPages,
      sortOptions: [],
    }"
    [sortEnabled]="false"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  ></app-generic-list>
</div>
