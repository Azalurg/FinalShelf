<div class="app-page">
  <h1>Authors</h1>
  <app-generic-list
    [items]="authors"
    listType="authors"
    [config]="{
      page: currentPage,
      pageSize: pageSize,
      totalPages: totalPages,
      sortOptions: sortOptions,
    }"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (sortChange)="onSortChange($event)"
  ></app-generic-list>
</div>
