<div class="app-page" *ngIf="genreDetails">
  <div class="details-container">
    <div class="details-info">
      <h1 class="details-title">
        {{ genreDetails.name }} ({{ genreDetails.books.length }})
      </h1>
    </div>
  </div>

  <app-generic-list
    [items]="genreDetails.books"
    listType="books"
    [paginationEnabled]="false"
    [sortEnabled]="false"
  ></app-generic-list>
</div>
