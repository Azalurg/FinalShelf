<div class="app-page">
  <h1>Settings <span *ngIf="appVersion" style="font-size: 0.5em; opacity: 0.6">v{{ appVersion }}</span></h1>
  <div class="db-settings">
    <div>
      <h2>Directory</h2>
      <select id="absolute-path" (change)="updatePath($event)">
        <ng-container *ngFor="let path of absolutePaths">
          <option [value]="path.id" [selected]="path === selectedPath">
            {{ path.absolute_path }}
          </option>
        </ng-container>
      </select>
      <button (click)="addPath()">Add path</button>
    </div>
    <div>
      <h2>Database</h2>
      <div class="scan-actions">
        <button (click)="quickScan()" [disabled]="isScanning">
          {{ isScanning ? 'Scanning...' : 'Quick scan' }}
        </button>
        <button (click)="fullScan()" [disabled]="isScanning">
          {{ isScanning ? 'Scanning...' : 'Full scan' }}
        </button>
      </div>
      <div class="scan-progress" *ngIf="scanProgress">
        <div class="progress-info">
          <span class="progress-phase">{{ scanProgress.phase | titlecase }}</span>
          <span class="progress-counts" *ngIf="scanProgress.total > 0">
            {{ scanProgress.current }} / {{ scanProgress.total }}
          </span>
        </div>
        <div class="progress-bar-container" *ngIf="scanProgress.total > 0">
          <div
            class="progress-bar"
            [style.width.%]="(scanProgress.current / scanProgress.total) * 100"
          ></div>
        </div>
        <div class="progress-message">{{ scanProgress.message }}</div>
      </div>
    </div>
    <div>
      <h2>Theme selection</h2>
      <select id="theme-switch" (change)="updateTheme($event)">
        <ng-container *ngFor="let theme of themes">
          <option [value]="theme" [selected]="theme === selectedTheme">
            {{ theme }}
          </option>
        </ng-container>
      </select>
    </div>
    <div>
      <h2>Test</h2>
      <button (click)="ping()">Ping</button>
    </div>
  </div>
</div>
