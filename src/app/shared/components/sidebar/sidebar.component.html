<div class="sidebar">
  <div class="sidebar__logo">
    <img src="assets/logo.svg" alt="Logo" />
  </div>
  <div class="sidebar__menu">
    <ul>
      <li *ngFor="let item of menuItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          *ngIf="!item.isExternal; else externalLink"
          [title]="item.label"
        >
          <img class="sidebar__icon" [src]="item.icon" [alt]="item.label" />
        </a>
        <ng-template #externalLink>
          <a [href]="item.path[0]" target="_blank" [title]="item.label">
            <img class="sidebar__icon" [src]="item.icon" [alt]="item.label" />
          </a>
        </ng-template>
      </li>
    </ul>
  </div>
  <div class="sidebar__user">
    <ul>
      <li *ngFor="let item of userItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [title]="item.label"
        >
          <img class="sidebar__icon" [src]="item.icon" [alt]="item.label" />
        </a>
      </li>
    </ul>
  </div>
  <div class="sidebar__settings">
    <ul>
      <li *ngFor="let item of settingItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          *ngIf="!item.isExternal; else externalLink"
          [title]="item.label"
        >
          <img class="sidebar__icon" [src]="item.icon" [alt]="item.label" />
        </a>
        <ng-template #externalLink>
          <a [href]="item.path[0]" target="_blank" [title]="item.label">
            <img class="sidebar__icon" [src]="item.icon" [alt]="item.label" />
          </a>
        </ng-template>
      </li>
      <li>
        <button (click)="exit()" title="Logout">
          <img
            class="sidebar__icon"
            src="assets/icons/close-circle-svgrepo-com.svg"
            alt="Logout"
          />
        </button>
      </li>
    </ul>
  </div>
</div>
