[package]
name = "finalshelf"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "finalshelf"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0", features = [ "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5.0"
id3 = "1.16.0"
diesel = { version = "2.2.10", features = ["sqlite", "chrono"] }
diesel_migrations = "2.0.0"
rusqlite = { version = "0.32.0", features = ["bundled"] }
dotenv = "0.15.0"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rayon = "1"
log = "0.4"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Dev-only binaries (gen_fixtures, bench_runner) — excluded from release builds
dev-fixtures = []

[[bin]]
name = "finalshelf"
path = "src/main.rs"

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"
required-features = ["dev-fixtures"]

[[bin]]
name = "bench_runner"
path = "src/bin/bench_runner.rs"
required-features = ["dev-fixtures"]
